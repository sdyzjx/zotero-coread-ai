<!DOCTYPE html>
<html windowtype="zoteropi:settings">
  <head>
    <meta charset="utf-8" />
    <title>CoRead AI 设置</title>
    <style>
      :root { --bg: #fff; --bg2: #f6f7f9; --fg: #1f2328; --muted: #6b7280; --border: rgba(0,0,0,.14); --accent: #6d5bd0; color-scheme: light dark; }
      @media (prefers-color-scheme: dark) { :root { --bg: #1e1f22; --bg2: #26272b; --fg: #e6e6e6; --muted: #9aa0a6; --border: rgba(255,255,255,.14); --accent: #a497ff; } }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--bg); color: var(--fg); font: message-box; font-size: 13px; }
      .page { max-width: 760px; margin: 0 auto; padding: 20px 24px 80px; }
      header { display: flex; gap: 12px; align-items: center; margin-bottom: 8px; }
      .logo { width: 42px; height: 42px; display: block; }
      h1 { font-size: 18px; margin: 0; }
      .sub { color: var(--muted); font-size: 12px; }
      section { border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; margin-top: 14px; background: var(--bg); }
      h2 { font-size: 14px; margin: 0 0 8px; }
      .field { display: flex; gap: 12px; padding: 6px 0; align-items: flex-start; }
      .label { flex: 0 0 150px; padding-top: 5px; font-weight: 500; }
      .control { flex: 1 1 auto; min-width: 0; }
      .hint { color: var(--muted); font-size: 11.5px; margin-top: 3px; }
      input:not([type=checkbox]):not([type=color]), select, textarea { width: 100%; padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--fg); font: inherit; }
      textarea { resize: vertical; }
      input[type=checkbox] { margin-top: 7px; }
      button { font: inherit; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg2); color: var(--fg); cursor: pointer; white-space: nowrap; }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button:disabled { opacity: .6; }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .row > input { flex: 1 1 200px; width: auto !important; }
      .actions { margin-top: 8px; }
      .remote { color: var(--muted); font-size: 12px; }
      .tag { padding: 1px 8px; margin: 2px; border-radius: 10px; font-size: 12px; }
      .action { display: grid; grid-template-columns: 110px 90px 1fr auto; gap: 6px; align-items: start; margin: 8px 0; }
      footer { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: flex-end; align-items: center; gap: 12px; padding: 10px 24px; border-top: 1px solid var(--border); background: var(--bg2); }
      .ok { color: #2e7d32; } .err { color: #c62828; max-width: 70%; overflow-wrap: anywhere; }
      .hint.top { margin: 0 0 8px; }
      .muted { color: var(--muted); }
      .toggle-row { display: inline-flex; align-items: center; gap: 6px; }
      .toggle-row input { margin: 0; }
      .field .toggle-row { padding-top: 5px; }
      /* model sources */
      .sources { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 4px 0 0; }
      .source { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; padding: 9px 10px; border-radius: 9px; background: var(--bg); text-align: left; white-space: normal; }
      .source:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--border)); }
      .source.active { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 9%, var(--bg)); box-shadow: 0 0 0 1px var(--accent) inset; }
      .source-head { display: flex; align-items: center; gap: 6px; width: 100%; }
      .source-name { font-weight: 600; flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .source-sub { color: var(--muted); font-size: 11.5px; }
      .dot { flex: 0 0 auto; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); opacity: .5; }
      .dot.on { background: #2e9d4f; opacity: 1; }
      .dot.warn { background: #d08a12; opacity: 1; }
      .badge { flex: 0 0 auto; font-size: 10.5px; padding: 0 6px; border-radius: 8px; background: var(--accent); color: #fff; line-height: 16px; }
      .panel { margin-top: 10px; padding: 8px 12px 10px; border: 1px solid var(--border); border-radius: 9px; background: var(--bg2); }
      .panel input:not([type=checkbox]):not([type=color]), .panel .dd-btn { background: var(--bg); }
      .remote { color: var(--muted); font-size: 12px; margin: 4px 0 0 162px; }
      /* workspaces */
      .ws-list { margin-top: 8px; border: 1px solid var(--border); border-radius: 8px; max-height: 260px; overflow-y: auto; }
      .ws-list > .muted { padding: 10px 12px; }
      .ws { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-top: 1px solid var(--border); }
      .ws:first-child { border-top: none; }
      .ws-main { flex: 1 1 auto; min-width: 0; }
      .ws-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .ws-meta { color: var(--muted); font-size: 11.5px; }
      .ws.orphan .ws-title { color: var(--muted); text-decoration: line-through; }
      .actions .ok, .actions .err { font-size: 12px; }
      @media (max-width: 620px) { .sources { grid-template-columns: repeat(2, minmax(0, 1fr)); } .field { flex-direction: column; gap: 4px; } .label { flex: none; } .remote { margin-left: 0; } }
      /* self-drawn dropdown (native <select> popups misrender in this dialog window) */
      .dd { position: relative; width: 100%; }
      .dd-btn { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: var(--bg); padding: 5px 8px; }
      .dd-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
      .dd.open .dd-btn { border-color: var(--accent); }
      .dd-value { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
      .dd-ph { color: var(--muted); }
      .dd-note { flex: 0 1 auto; color: var(--muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; }
      .dd-chev { flex: 0 0 auto; color: var(--muted); font-size: 11px; }
      .dd-list { position: absolute; z-index: 50; left: 0; right: 0; top: calc(100% + 3px); max-height: 280px; overflow-y: auto; padding: 4px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); box-shadow: 0 8px 24px rgba(0,0,0,.18); }
      .dd-list.up { top: auto; bottom: calc(100% + 3px); }
      .dd-group { padding: 6px 8px 2px; color: var(--muted); font-size: 11px; font-weight: 600; }
      .dd-opt { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 5px; cursor: default; }
      .dd-opt .dd-label { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .dd-opt.active { background: var(--bg2); }
      .dd-opt.selected .dd-label { color: var(--accent); font-weight: 600; }
      .dd-opt.disabled { opacity: .5; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="settings.js"></script>
  </body>
</html>
